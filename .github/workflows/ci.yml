name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked package
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Parse-check shipped JavaScript
        run: npm run lint

  release-gate:
    name: Release gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked package
        run: npm ci
      - name: Run coverage
        run: npm run test:coverage
      - name: Build static app
        run: npm run build
      - name: Run passing example gate
        run: npm run check
      - name: Audit package metadata
        run: npm audit --audit-level=high
      - name: Inspect package contents
        run: npm pack --dry-run
